<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Araucaria Season Sale</title>

<style>
*{box-sizing:border-box}

:root{
  --blue:#071a4a;
  --blue2:#123b86;
  --gold:#f5c84c;
  --gold2:#b88718;
  --white:#fffdf5;
  --muted:#d8e3ff;
  --dark:#071329;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#2458b8 0%,#0b245f 35%,#020a20 100%);
  color:var(--white);
  padding:16px;
}

.stage{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:24px 16px 22px;
  border:2px solid var(--gold);
  border-radius:24px;
  background:rgba(4,18,52,.82);
  box-shadow:
    0 0 20px rgba(245,200,76,.18),
    0 20px 50px rgba(0,0,0,.45);
}

.brand{
  text-align:center;
  font-size:12px;
  font-weight:800;
  letter-spacing:2px;
  color:var(--gold);
  margin-bottom:5px;
}

h1{
  margin:0;
  text-align:center;
  font-size:clamp(42px,12vw,82px);
  line-height:.95;
  font-weight:1000;
  letter-spacing:2px;
  color:var(--white);
  text-shadow:
    0 3px 0 #8c6814,
    0 0 18px rgba(245,200,76,.5);
}

.subtitle{
  text-align:center;
  margin:12px 0 22px;
  font-size:15px;
  font-weight:900;
  letter-spacing:2px;
  color:var(--muted);
}

.choices{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}

.choice{
  position:relative;
  min-height:230px;
  border:2px solid var(--gold);
  border-radius:18px;
  background:linear-gradient(145deg,#fffef8,#e8edf8);
  color:var(--dark);
  padding:18px 16px 20px;
  cursor:pointer;
  box-shadow:
    0 9px 0 var(--gold2),
    0 15px 28px rgba(0,0,0,.42);
  transition:
    transform .12s ease,
    box-shadow .12s ease,
    filter .15s ease;
  overflow:hidden;
}

.choice:hover{
  filter:brightness(1.06);
  transform:translateY(-3px);
}

.choice:active,
.choice.pressed{
  transform:translateY(7px) scale(.985);
  box-shadow:
    0 2px 0 var(--gold2),
    0 5px 12px rgba(0,0,0,.35);
}

.choice.flash{
  animation:choiceFlash .45s ease;
}

@keyframes choiceFlash{
  0%{filter:brightness(1)}
  35%{
    filter:brightness(1.45);
    box-shadow:
      0 0 8px #fff,
      0 0 28px var(--gold),
      0 9px 0 var(--gold2);
  }
  100%{filter:brightness(1)}
}

.letter{
  width:64px;
  height:64px;
  margin:0 auto 12px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#173e88,#071d51);
  color:var(--gold);
  border:2px solid var(--gold);
  font-size:42px;
  font-weight:1000;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.2),
    0 6px 0 #030d28,
    0 10px 18px rgba(0,0,0,.35);
}

.reward{
  text-align:center;
  font-size:clamp(23px,6vw,34px);
  line-height:1.05;
  font-weight:1000;
  color:#071a4a;
  margin-bottom:10px;
}

.detail{
  text-align:center;
  font-size:17px;
  line-height:1.25;
  font-weight:800;
  color:#24365d;
}

.code-area{
  margin-top:28px;
  padding:18px 14px;
  border-top:1px solid rgba(245,200,76,.5);
  text-align:center;
}

.warning{
  font-size:clamp(17px,4.5vw,23px);
  font-weight:1000;
  letter-spacing:1px;
  color:var(--gold);
  margin-bottom:8px;
  text-shadow:0 0 10px rgba(245,200,76,.25);
}

.warning-sub{
  color:var(--muted);
  font-size:15px;
  line-height:1.4;
  font-weight:700;
  margin-bottom:16px;
}

.code-row{
  display:flex;
  flex-direction:column;
  gap:10px;
  max-width:430px;
  margin:auto;
}

input{
  width:100%;
  min-height:54px;
  border:2px solid var(--gold);
  border-radius:12px;
  padding:0 16px;
  text-align:center;
  font-size:21px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  outline:none;
}

input:focus{
  box-shadow:0 0 0 3px rgba(245,200,76,.22);
}

#unlock{
  min-height:56px;
  border:2px solid #fff1a5;
  border-radius:12px;
  background:linear-gradient(145deg,#ffd95e,#c89220);
  color:#211600;
  font-size:18px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:
    0 6px 0 #805b0c,
    0 10px 18px rgba(0,0,0,.35);
  transition:.12s ease;
}

#unlock:active{
  transform:translateY(5px);
  box-shadow:
    0 1px 0 #805b0c,
    0 4px 8px rgba(0,0,0,.3);
}

#unlock.flash{
  animation:unlockFlash .4s ease;
}

@keyframes unlockFlash{
  0%{filter:brightness(1)}
  40%{filter:brightness(1.5)}
  100%{filter:brightness(1)}
}

.status{
  min-height:24px;
  margin-top:12px;
  font-size:14px;
  font-weight:800;
  color:var(--muted);
}

.result{
  margin-top:16px;
  padding:18px 12px;
  border-radius:14px;
  background:rgba(245,200,76,.12);
  border:1px solid rgba(245,200,76,.55);
  font-size:18px;
  font-weight:900;
  line-height:1.4;
  display:none;
}

.footer{
  margin-top:18px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  font-weight:700;
}

@media(min-width:700px){
  body{padding:28px}

  .stage{
    padding:32px 28px 26px;
  }

  .choices{
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }

  .choice{
    min-height:285px;
    padding:20px 14px;
  }

  .code-row{
    display:grid;
    grid-template-columns:1fr 170px;
  }
}
</style>
</head>

<body>

<main class="stage">

  <div class="brand">ARAUCARIA SEEDLINGS TAGAYTAY</div>

  <h1>SEASON SALE</h1>

  <div class="subtitle">CHOOSE YOUR REWARD WISELY</div>

  <section class="choices">

    <button class="choice" data-choice="A" type="button">
      <div class="letter">A</div>
      <div class="reward">50 FREE<br>SEEDLINGS</div>
      <div class="detail">+ 20% Shipping Fee Discount</div>
    </button>

    <button class="choice" data-choice="B" type="button">
      <div class="letter">B</div>
      <div class="reward">30 FREE<br>SEEDLINGS</div>
      <div class="detail">+ 1 Araucaria Plant<br>1.5–2 ft</div>
    </button>

    <button class="choice" data-choice="C" type="button">
      <div class="letter">C</div>
      <div class="reward">10 FREE<br>SEEDLINGS</div>
      <div class="detail">+ 10% OFF Total Price</div>
    </button>

  </section>

  <section class="code-area">

    <div class="warning">ONE CLICK. ONE CHOICE. ONE REWARD.</div>

    <div class="warning-sub">
      Take your pick wisely — your choice is final and cannot be changed.
    </div>

    <div class="code-row">

      <input
        id="code"
        maxlength="6"
        placeholder="ENTER PROMO CODE"
        autocomplete="off"
        spellcheck="false"
      >

      <button id="unlock" type="button">
        UNLOCK REWARDS
      </button>

    </div>

    <div id="status" class="status"></div>

    <div id="result" class="result"></div>

  </section>

  <div class="footer">
    Minimum order: 1,000 seedlings • Your choice is final and cannot be changed.
  </div>

</main>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbwZnQ7p0pvTkqADf4PHVSpX2olZiAFzLfOMiuh9FGLtfGOI8wdxxUh7cJz1IFlcpCY/exec";

let activeCode = null;
let pendingChoice = null;
let pendingRequestId = null;

const input = document.getElementById("code");
const unlock = document.getElementById("unlock");
const status = document.getElementById("status");
const result = document.getElementById("result");
const buttons = document.querySelectorAll(".choice");


/* =========================
   SOUND
========================= */

function playSound(type){

  try{

    const AudioCtx =
      window.AudioContext ||
      window.webkitAudioContext;

    if(!AudioCtx) return;

    const ctx = new AudioCtx();
    const gain = ctx.createGain();
    const osc = ctx.createOscillator();

    gain.connect(ctx.destination);
    osc.connect(gain);

    if(type === "unlock"){

      osc.frequency.setValueAtTime(
        520,
        ctx.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        760,
        ctx.currentTime + 0.16
      );

    }else{

      osc.frequency.setValueAtTime(
        420,
        ctx.currentTime
      );

      osc.frequency.exponentialRampToValueAtTime(
        900,
        ctx.currentTime + 0.22
      );

    }

    osc.type = "triangle";

    gain.gain.setValueAtTime(
      0.0001,
      ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      0.18,
      ctx.currentTime + 0.02
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      ctx.currentTime + 0.28
    );

    osc.start();
    osc.stop(ctx.currentTime + 0.3);

    setTimeout(function(){
      try{ctx.close();}catch(e){}
    },400);

  }catch(e){}

}


/* =========================
   REQUEST ID
========================= */

function createRequestId(){

  return Date.now().toString(36) +
    "_" +
    Math.random().toString(36).substring(2,10);

}


/* =========================
   SIMPLE JSONP
========================= */

function callAPI(params, callback){

  const callbackName =
    "promoCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random() * 100000);

  let finished = false;

  const script =
    document.createElement("script");

  const timeout =
    setTimeout(function(){

      if(finished) return;

      finished = true;

      cleanup();

      callback({
        error:true
      });

    },12000);


  function cleanup(){

    clearTimeout(timeout);

    try{
      delete window[callbackName];
    }catch(e){}

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data){

      if(finished) return;

      finished = true;

      cleanup();

      callback(data);

    };


  const query =
    new URLSearchParams(params);

  query.set(
    "callback",
    callbackName
  );


  script.src =
    API_URL +
    "?" +
    query.toString();

  script.async = true;


  script.onerror =
    function(){

      if(finished) return;

      finished = true;

      cleanup();

      callback({
        error:true
      });

    };


  document.body.appendChild(script);

}


/* =========================
   UNLOCK
========================= */

unlock.addEventListener(
  "click",
  function(){

    const code =
      input.value
        .trim()
        .toUpperCase();

    if(!/^AST\d{3}$/.test(code)){

      status.textContent =
        "Please enter a valid promo access code.";

      return;

    }

    playSound("unlock");

    unlock.classList.remove("flash");

    void unlock.offsetWidth;

    unlock.classList.add("flash");

    status.textContent =
      "Checking promo code...";

    result.style.display = "none";

    activeCode = null;
    pendingChoice = null;
    pendingRequestId = null;


    callAPI(
      {
        action:"check",
        code:code
      },
      function(data){

        if(data && data.valid){

          activeCode = code;

          status.textContent =
            "Unlocked! Choose A, B, or C.";

        }

        else if(data && data.error){

          status.textContent =
            "Connection error. Please try again.";

        }

        else{

          status.textContent =
            "Invalid or already used promo access code.";

        }

      }
    );

  }
);


/* =========================
   CHOICE
========================= */

buttons.forEach(
  function(button){

    button.addEventListener(
      "click",
      function(){

        if(!activeCode){

          status.textContent =
            "Enter and unlock your promo code first.";

          return;

        }

        const choice =
          button.dataset.choice;


        if(
          pendingChoice &&
          pendingChoice !== choice
        ){

          status.textContent =
            "Please use your original choice.";

          return;

        }


        if(!pendingChoice){

          pendingChoice = choice;
          pendingRequestId = createRequestId();

        }


        playSound("choice");

        button.classList.remove(
          "flash",
          "pressed"
        );

        void button.offsetWidth;

        button.classList.add(
          "flash",
          "pressed"
        );


        buttons.forEach(
          function(b){

            b.disabled =
              b !== button;

          }
        );


        unlock.disabled = true;
        input.disabled = true;


        status.textContent =
          "Processing your reward...";


        callAPI(
          {
            action:"use",
            code:activeCode,
            choice:pendingChoice,
            requestId:pendingRequestId
          },
          function(data){

            if(data && data.success){

              let reward = "";

              if(pendingChoice === "A"){

                reward =
                  "You chose A — 50 FREE seedlings + 20% Shipping Fee Discount.";

              }

              if(pendingChoice === "B"){

                reward =
                  "You chose B — 30 FREE seedlings + 1 Araucaria Plant (1.5–2 ft).";

              }

              if(pendingChoice === "C"){

                reward =
                  "You chose C — 10 FREE seedlings + 10% OFF Total Price.";

              }


              result.textContent =
                "🎉 REWARD CONFIRMED! " +
                reward;

              result.style.display =
                "block";


              status.textContent =
                "Your choice has been locked. Please message us to place your order.";


              activeCode = null;
              pendingChoice = null;
              pendingRequestId = null;

            }


            else if(data && data.error){

              /*
               * IMPORTANT:
               * The code is NOT assumed to be consumed
               * by the browser.
               *
               * The customer may press the SAME
               * choice again.
               */

              status.textContent =
                "Connection error. Your code is still safe. Please press the SAME choice again.";

              buttons.forEach(
                function(b){

                  b.disabled =
                    b.dataset.choice !== pendingChoice;

                }
              );

            }


            else{

              status.textContent =
                "Sorry, this promo code is no longer available.";

              buttons.forEach(
                function(b){
                  b.disabled = true;
                }
              );

            }

          }
        );

      }
    );

  }
);


/* =========================
   INPUT
========================= */

input.addEventListener(
  "input",
  function(){

    this.value =
      this.value
        .toUpperCase()
        .replace(/[^A-Z0-9]/g,"");

  }
);

</script>

</body>
</html>
